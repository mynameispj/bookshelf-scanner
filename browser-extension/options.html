<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bookshelf Scanner — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f3ef;
      color: #1b1b1b;
      padding: 32px;
      max-width: 480px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 4px; }
    p.sub { font-size: .85rem; color: #6b7280; margin-bottom: 24px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
    input[type="url"], input[type="text"] {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: .9rem;
      margin-bottom: 6px;
      background: #fff;
    }
    .hint { font-size: .78rem; color: #6b7280; margin-bottom: 20px; }
    button {
      background: #2d6a4f;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1b4332; }
    #status { margin-top: 12px; font-size: .85rem; color: #2d6a4f; font-weight: 600; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>📚 Bookshelf Scanner Settings</h1>
  <p class="sub">Configure the API server the extension connects to.</p>

  <label for="server-url">Server URL</label>
  <input type="text" id="server-url" placeholder="http://localhost:3000" />
  <p class="hint">Default: <code>http://localhost:3000</code> for local development. Use your Vercel deployment URL for production.</p>

  <button id="btn-save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
